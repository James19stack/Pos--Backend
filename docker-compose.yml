services:
  db:
    image: postgres:16
    container_name: pos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pos_dev
    ports:
      - "5434:5432"
    volumes:
      - pos_pgdata:/var/lib/postgresql/data


volumes:
  pos_pgdata: